<div class="task-item" [class.completed]="task.completed">
  <input
    type="checkbox"
    [checked]="task.completed"
    (change)="toggle.emit(task)"
    class="task-checkbox"
  />

  <div class="task-content">
    <ng-container *ngIf="isEditing; else viewMode">
      <input class="input" [(ngModel)]="editTitle" />
      <textarea class="input textarea" rows="2" [(ngModel)]="editDescription"></textarea>
    </ng-container>

    <ng-template #viewMode>
      <p class="task-title">{{ task.title }}</p>
      <p class="task-desc" *ngIf="task.description">{{ task.description }}</p>
      <div class="task-meta">
        <span class="badge badge-{{ task.priority }}">{{ task.priority }}</span>
        <span class="badge badge-date" *ngIf="formattedDate() as d">Due {{ d }}</span>
      </div>
    </ng-template>
  </div>

  <div class="task-actions">
    <button *ngIf="isEditing" class="btn btn-small btn-primary" (click)="saveEdit()">
      Save
    </button>
    <button *ngIf="!isEditing" class="btn btn-small btn-ghost" (click)="startEdit()">
      Edit
    </button>
    <button class="btn btn-small btn-danger" (click)="delete.emit(task._id)">Delete</button>
  </div>
</div>
